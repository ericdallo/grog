[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "grog-voice"
version = "0.1.0"
description = "grog's ears and mouth: hands-free voice turns with grog"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy", "openvino", "piper-tts", "pysilero-vad", "sentencepiece", "sherpa-onnx"]

[project.scripts]
grog-voice = "grog_voice.main:main"

[tool.setuptools]
packages = ["grog_voice"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
