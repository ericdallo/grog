<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="skin.css" />
    <script type="module" src="skin.js"></script>
  </head>
  <body data-mode="offline">
    <div class="app">
      <aside class="block">
        <div class="brand">
          <div class="name" id="name"></div>
          <div class="meta">
            <span class="model" id="model"></span>
            <span class="sep">·</span>
            <span id="account"></span>
          </div>
        </div>

        <div class="avatar" id="avatar" role="button"></div>

        <div>
          <div class="label" id="label"></div>
          <div class="detail" id="detail"></div>
          <div class="timer" id="timer"></div>
        </div>
      </aside>

      <main class="content">
        <div class="time">
          <div class="clock" id="clock"></div>
          <div class="date" id="date"></div>
          <button class="round" id="open-actions" type="button" aria-label="Actions" hidden></button>
        </div>
        <div class="notice" id="notice" hidden></div>

        <section class="card" id="card" hidden>
          <h2 id="card-title"></h2>
          <div class="card-detail" id="card-detail"></div>
          <div class="card-body">
            <img class="qr" id="card-qr" alt="" hidden />
            <div class="card-text">
              <div class="question" id="card-question"></div>
              <div class="hint" id="card-hint"></div>
              <div class="url" id="card-link"></div>
              <div class="hint" id="card-hint2"></div>
              <div class="code" id="card-code"></div>
              <div class="command" id="card-command"></div>
              <div class="hint" id="card-expires"></div>
            </div>
          </div>
          <div class="card-note" id="card-note"></div>
          <div class="card-error" id="card-error"></div>
          <div class="card-help" id="card-help" hidden>
            <div class="first">First time?</div>
            <div id="card-help-text"></div>
            <div class="url" id="card-help-url"></div>
          </div>
          <div class="card-buttons" id="card-buttons"></div>
          <div class="card-error" id="card-asked"></div>
        </section>

        <div class="chat-box">
          <ol class="chat" id="chat"></ol>
          <button class="round chat-end" id="chat-end" type="button" aria-label="Latest" hidden></button>
        </div>

        <ol class="pipeline" id="pipeline"></ol>

        <section class="player" id="player" aria-label="Music" hidden>
          <button class="round" id="open-music" type="button" aria-label="Choose what plays"></button>
          <div class="playing">
            <div class="song" id="player-title"></div>
            <div class="line">
              <span class="artist" id="player-artist"></span>
              <span class="at" id="player-time"></span>
            </div>
            <div class="player-error" id="player-error"></div>
          </div>
          <div class="buttons">
            <div class="loudness">
              <button class="round" type="button" data-action="music-down" id="music-down" aria-label="Quieter"></button>
              <span class="level" id="player-volume"></span>
              <button class="round" type="button" data-action="music-up" id="music-up" aria-label="Louder"></button>
            </div>
            <div class="controls" id="player-controls"></div>
          </div>
        </section>
      </main>

      <section class="sheet" id="sheet" aria-label="Actions">
        <div class="sheet-top">
          <h2>Actions</h2>
          <button class="round" id="close-actions" type="button" aria-label="Close"></button>
        </div>
        <div class="items" id="items"></div>
        <section class="panel usage" id="usage" hidden></section>
        <div class="sheet-error" id="sheet-error"></div>
        <div class="sheet-version" id="sheet-version"></div>
      </section>

      <section class="sheet" id="music-sheet" aria-label="Music">
        <div class="sheet-top">
          <h2>Music</h2>
          <button class="round" id="close-music" type="button" aria-label="Close"></button>
        </div>
        <div class="sheet-note" id="music-note"></div>
        <div class="items"><ul class="group" id="music-items"></ul></div>
        <div class="sheet-error" id="music-error"></div>
      </section>

      <section class="sheet" id="speakers-sheet" aria-label="Speakers">
        <div class="sheet-top">
          <h2>Speakers</h2>
          <button class="round" id="close-speakers" type="button" aria-label="Close"></button>
        </div>
        <div class="sheet-note" id="speakers-note"></div>
        <div class="items" id="speakers-items"></div>
        <div class="sheet-error" id="speakers-error"></div>
      </section>
    </div>
  </body>
</html>
