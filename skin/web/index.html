<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="skin.css" />
    <script type="module" src="skin.js"></script>
  </head>
  <body data-mode="offline">
    <div class="app">
      <aside class="block">
        <div class="brand">
          <div class="name" id="name"></div>
          <div class="meta">
            <span class="model" id="model"></span>
            <span class="sep">·</span>
            <span id="account"></span>
          </div>
        </div>

        <div class="avatar" id="avatar" role="button"></div>

        <div>
          <div class="label" id="label"></div>
          <div class="detail" id="detail"></div>
          <div class="timer" id="timer"></div>
        </div>
      </aside>

      <main class="content">
        <div class="time">
          <div class="clock" id="clock"></div>
          <div class="date" id="date"></div>
          <button class="round" id="open-actions" type="button" aria-label="Actions" hidden></button>
        </div>
        <div class="notice" id="notice" hidden></div>

        <section class="signin" id="signin" hidden>
          <h2 id="signin-title"></h2>
          <div class="signin-code">
            <img class="qr" id="signin-qr" alt="" hidden />
            <div>
              <div class="hint">On your phone or computer, open</div>
              <div class="url" id="signin-url"></div>
              <div class="hint">and enter the code</div>
              <div class="code" id="signin-code"></div>
              <div class="hint" id="signin-expires"></div>
            </div>
          </div>
          <div class="signin-note" id="signin-note"></div>
          <div class="signin-error" id="signin-error"></div>
          <div class="signin-help" id="signin-help">
            <div class="first">First time?</div>
            <div id="signin-help-text"></div>
            <div class="url" id="signin-help-url"></div>
          </div>
        </section>

        <section class="pairing" id="pairing" hidden>
          <h2 id="pairing-title"></h2>
          <div class="pairing-detail" id="pairing-detail"></div>
          <div class="hint" id="pairing-hint"></div>
          <div class="command" id="pairing-command"></div>
          <div class="code" id="pairing-code"></div>
          <div class="pairing-note" id="pairing-note"></div>
          <div class="pairing-buttons" id="pairing-buttons"></div>
          <div class="hint" id="pairing-expires"></div>
          <div class="pairing-error" id="pairing-error"></div>
        </section>

        <div class="chat-box">
          <ol class="chat" id="chat"></ol>
          <button class="round chat-end" id="chat-end" type="button" aria-label="Latest" hidden></button>
        </div>

        <ol class="pipeline" id="pipeline"></ol>
      </main>

      <section class="sheet" id="sheet" aria-label="Actions">
        <div class="sheet-top">
          <h2>Actions</h2>
          <button class="round" id="close-actions" type="button" aria-label="Close"></button>
        </div>
        <div class="items" id="items"></div>
        <section class="panel usage" id="usage" hidden></section>
        <div class="sheet-error" id="sheet-error"></div>
        <div class="sheet-version" id="sheet-version"></div>
      </section>
    </div>
  </body>
</html>
